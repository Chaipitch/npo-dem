<template>
  <div class="dash">
    <section class="banner">
      <div>
        <h1 class="banner-title">{bannerTitle}</h1>
        <p class="banner-sub">{bannerSubtitle}</p>
      </div>
      <p class="banner-script" aria-hidden="true">
        Stronger Communities.<br />Brighter Futures.
      </p>
    </section>

    <template lwc:if={isLoading}>
      <p class="muted pad" role="status">Loading your giving summary…</p>
    </template>
    <template lwc:elseif={error}>
      <p class="alert" role="alert">{error}</p>
    </template>
    <template lwc:else>
      <div class="layout">
        <div class="main">
          <p class="greeting">{greeting}</p>

          <!-- KPI cards -->
          <div class="kpis">
            <div class="kpi">
              <span class="kpi-icon kpi-red" aria-hidden="true">♥</span>
              <div>
                <p class="kpi-value">{totalDisplay}</p>
                <p class="kpi-label">Total Contributions</p>
                <button
                  type="button"
                  class="kpi-link"
                  data-target="history"
                  onclick={handleScroll}
                >
                  View Giving History →
                </button>
              </div>
            </div>
            <div class="kpi">
              <span class="kpi-icon kpi-green" aria-hidden="true">👥</span>
              <div>
                <p class="kpi-value">{causesDisplay}</p>
                <p class="kpi-label">Causes Supported</p>
                <button
                  type="button"
                  class="kpi-link"
                  data-target="causes"
                  onclick={handleScroll}
                >
                  See My Causes →
                </button>
              </div>
            </div>
            <div class="kpi">
              <span class="kpi-icon kpi-purple" aria-hidden="true">📅</span>
              <div>
                <p class="kpi-value">{sinceDisplay}</p>
                <p class="kpi-label">Supporter Since</p>
                <button
                  type="button"
                  class="kpi-link"
                  data-target="journey"
                  onclick={handleScroll}
                >
                  View My Journey →
                </button>
              </div>
            </div>
          </div>
          <template lwc:if={monthlyNote}>
            <p class="monthly">🔁 {monthlyNote}</p>
          </template>

          <!-- Shared impact -->
          <h2 class="section-title">Our Shared Impact</h2>
          <div class="impact">
            <template for:each={impactTiles} for:item="t">
              <div key={t.key} class={t.className}>
                <span class="impact-icon" aria-hidden="true">{t.icon}</span>
                <div>
                  <p class="impact-value">{t.value}</p>
                  <p class="impact-label">{t.label}</p>
                </div>
              </div>
            </template>
          </div>

          <!-- Stories -->
          <h2 class="section-title">Stories From the Programs You Support</h2>
          <div class="stories">
            <template for:each={storyCards} for:item="s">
              <article key={s.key} class="story">
                <div class="story-img" aria-hidden="true">{s.icon}</div>
                <div class="story-body">
                  <span class={s.tagClass}>{s.tag}</span>
                  <h3 class="story-title">{s.title}</h3>
                  <p class="story-text">{s.summary}</p>
                </div>
              </article>
            </template>
          </div>

          <!-- Causes -->
          <h2 class="section-title" data-section="causes">Causes I Support</h2>
          <div class="chips">
            <template for:each={causes} for:item="c">
              <span key={c} class="chip">{c}</span>
            </template>
          </div>

          <!-- Journey -->
          <h2 class="section-title" data-section="journey">
            Your Impact Journey
          </h2>
          <ol class="journey">
            <template for:each={journey} for:item="m">
              <li key={m.key} class="journey-item">
                <span class={m.dotClass} aria-hidden="true">{m.icon}</span>
                <div>
                  <p class="journey-year">{m.year}</p>
                  <p class="journey-label">{m.label}</p>
                </div>
                <template lwc:if={m.showLine}
                  ><span class="journey-line" aria-hidden="true"></span
                ></template>
              </li>
            </template>
          </ol>

          <!-- History -->
          <div class="history-head" data-section="history">
            <h2 class="section-title">My Giving</h2>
            <a class="give-again" href={donateHref}>Give again →</a>
          </div>
          <template lwc:if={hasGifts}>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Date</th>
                    <th scope="col">Campaign</th>
                    <th scope="col">Designation</th>
                    <th scope="col" class="num">Amount</th>
                    <th scope="col">Status</th>
                  </tr>
                </thead>
                <tbody>
                  <template for:each={gifts} for:item="g">
                    <tr key={g.id}>
                      <td data-label="Date">{g.dateDisplay}</td>
                      <td data-label="Campaign">{g.campaignName}</td>
                      <td data-label="Designation">{g.designations}</td>
                      <td data-label="Amount" class="num strong">
                        {g.amountDisplay}
                      </td>
                      <td data-label="Status">
                        <span class={g.statusClass}>{g.status}</span>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>
          <template lwc:else>
            <p class="muted">No gifts yet — your first one will appear here.</p>
          </template>
        </div>

        <!-- Agent panel -->
        <aside class="agent">
          <div class="agent-head">
            <span class="agent-icon" aria-hidden="true">✦</span>
            <div>
              <h2 class="agent-title">Ask About Your Journey</h2>
              <p class="agent-sub">
                Get personalized answers based on the programs and information
                available to you.
              </p>
            </div>
          </div>
          <p class="agent-powered">Powered by Agentforce</p>
          <div class="agent-chips">
            <template for:each={suggestions} for:item="q">
              <button
                key={q.key}
                type="button"
                class="agent-chip"
                onclick={handleAsk}
              >
                {q.label}
              </button>
            </template>
          </div>
          <button type="button" class="agent-input" onclick={handleAsk}>
            <span>Ask another question about your impact…</span>
            <span class="agent-send" aria-hidden="true">→</span>
          </button>
          <template lwc:if={agentUnavailable}>
            <p class="muted small">
              Chat is not available on this page right now.
            </p>
          </template>
        </aside>
      </div>
    </template>
  </div>
</template>
