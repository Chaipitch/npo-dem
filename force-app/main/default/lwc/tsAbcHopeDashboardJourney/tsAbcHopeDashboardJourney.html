<template>
  <ol class="years" data-id="journey">
    <template for:each={journeyYears} for:item="y">
      <li key={y.key} class="year-card" data-id="journey-year">
        <div class="year-head">
          <span class={y.dotClass}
            ><c-ts-abc-hope-icon
              name={y.icon}
              size="22"
              stroke-width="2"
            ></c-ts-abc-hope-icon
          ></span>
          <div class="year-title">
            <p class="year">{y.year}</p>
            <p class="year-meta">{y.meta}</p>
          </div>
          <template lwc:if={y.joined}>
            <span class="badge badge_joined">Joined</span>
          </template>
        </div>
        <template lwc:if={y.hasItems}>
          <ul
            class={y.itemsClass}
            tabindex={y.tabIndex}
            aria-label={y.listLabel}
          >
            <template for:each={y.items} for:item="it">
              <li key={it.key} class="year-item">
                <div class="item-text">
                  <p class="item-cause">
                    {it.cause}
                    <template lwc:if={it.isNew}>
                      <span class="badge badge_new">New</span>
                    </template>
                  </p>
                  <template lwc:if={it.program}>
                    <p class="item-program">{it.program}</p>
                  </template>
                </div>
                <p class="item-amount">{it.amountDisplay}</p>
              </li>
            </template>
          </ul>
        </template>
        <template lwc:else>
          <p class="year-empty">Joined ABC Hope as a supporter.</p>
        </template>
      </li>
    </template>
  </ol>
</template>
