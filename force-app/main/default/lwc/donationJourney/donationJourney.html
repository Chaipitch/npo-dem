<template>
  <section class="journey" aria-label="Donation">
    <ol class="stepper">
      <template for:each={steps} for:item="step">
        <li
          key={step.key}
          class={step.className}
          aria-current={step.ariaCurrent}
        >
          <span class="step-dot">{step.number}</span>
          <span class="step-label">{step.label}</span>
          <template lwc:if={step.showConnector}>
            <span class={step.connectorClass} aria-hidden="true"></span>
          </template>
        </li>
      </template>
    </ol>

    <template lwc:if={isLoading}>
      <div class="card loading" role="status">Loading…</div>
    </template>
    <template lwc:elseif={loadError}>
      <div class="card">
        <p class="alert alert_error" role="alert">{loadError}</p>
      </div>
    </template>
    <template lwc:else>
      <div class="card">
        <template lwc:if={showBanner}>
          <div class="banner" data-id="banner">
            <img class="banner-img" src={banner.url} alt="" />
            <span class="banner-credit">{banner.credit}</span>
          </div>
        </template>
        <!-- Step 1: Choose donation -->
        <template lwc:if={isChoose}>
          <p class="eyebrow">{campaignLabel}</p>
          <h2 class="title">{heading}</h2>
          <p class="subtitle">{subtitleText}</p>

          <template lwc:if={showCampaignPicker}>
            <label class="field field_campaign">
              <span class="field-label">Campaign</span>
              <span class="select-wrap">
                <span class="select-icon"
                  ><c-abc-hope-icon name="gift" size="22"></c-abc-hope-icon
                ></span>
                <select
                  class="input select"
                  data-id="campaign"
                  onchange={handleCampaign}
                >
                  <template for:each={campaignOptions} for:item="opt">
                    <option
                      key={opt.value}
                      value={opt.value}
                      selected={opt.selected}
                    >
                      {opt.label}
                    </option>
                  </template>
                </select>
              </span>
            </label>
          </template>

          <div class="toggle" role="group" aria-label="Donation frequency">
            <button
              type="button"
              class={oneTimeClass}
              data-value="One-time"
              aria-pressed={isOneTime}
              onclick={handleFrequency}
            >
              One-time
            </button>
            <button
              type="button"
              class={recurringClass}
              data-value="Recurring"
              aria-pressed={isRecurring}
              onclick={handleFrequency}
            >
              Recurring
            </button>
          </div>
          <template lwc:if={isRecurring}>
            <div
              class="periods"
              role="group"
              aria-label="How often"
              data-id="periods"
            >
              <template for:each={periodOptions} for:item="p">
                <button
                  key={p.value}
                  type="button"
                  class={p.className}
                  data-value={p.value}
                  aria-pressed={p.selected}
                  onclick={handlePeriod}
                >
                  {p.value}
                </button>
              </template>
            </div>
          </template>

          <div class="amounts" role="group" aria-label="Donation amount">
            <template for:each={amountTiles} for:item="tile">
              <button
                key={tile.key}
                type="button"
                class={tile.className}
                data-value={tile.value}
                aria-pressed={tile.selected}
                onclick={handleAmount}
              >
                <span class="amount-currency">{currencyLabel}</span>
                <span class="amount-value">{tile.display}</span>
              </button>
            </template>
            <button
              type="button"
              class={otherClass}
              aria-pressed={isOther}
              onclick={handleOther}
            >
              Other
            </button>
          </div>

          <template lwc:if={isOther}>
            <label class="field">
              <span class="field-label">Other amount ({currencyLabel})</span>
              <input
                class="input"
                data-id="otherAmount"
                type="number"
                inputmode="numeric"
                min={otherMin}
                max={otherMax}
                step="1"
                value={otherAmount}
                placeholder="e.g. 2500"
                oninput={handleOtherAmount}
              />
            </label>
          </template>
          <template lwc:if={amountError}>
            <p class="field-error" role="alert">{amountError}</p>
          </template>
          <template lwc:if={isRecurring}>
            <p class="hint">{recurringHint}</p>
          </template>

          <label class="field">
            <span class="field-label">Support</span>
            <span class="select-wrap">
              <span class="select-icon"
                ><c-abc-hope-icon name="backpack" size="22"></c-abc-hope-icon
              ></span>
              <select
                class="input select"
                data-id="designation"
                onchange={handleDesignation}
              >
                <template for:each={designationOptions} for:item="opt">
                  <option
                    key={opt.value}
                    value={opt.value}
                    selected={opt.selected}
                  >
                    {opt.label}
                  </option>
                </template>
              </select>
            </span>
          </label>
          <template lwc:if={designationProgram}>
            <p class="hint" data-id="program-hint">
              Funds our {designationProgram} program.
            </p>
          </template>
          <template lwc:if={designationError}>
            <p class="field-error" role="alert">{designationError}</p>
          </template>
        </template>

        <!-- Step 2: Your details -->
        <template lwc:if={isDetails}>
          <h2 class="title">Your details</h2>
          <template lwc:if={isSignedIn}>
            <p class="subtitle">
              You're signed in, so we'll use the details on your donor profile.
            </p>
            <div class="welcome">
              <span class="avatar" aria-hidden="true">✦</span>
              <div>
                <p class="welcome-small">Welcome back,</p>
                <p class="welcome-name">{currentDonor.name}</p>
                <p class="muted">{currentDonor.email}</p>
              </div>
            </div>
          </template>
          <template lwc:else>
            <p class="subtitle">
              Tell us a bit about yourself so we can keep you updated on the
              impact of your generosity.
            </p>
            <div class="toggle" role="group" aria-label="Donor type">
              <button
                type="button"
                class={individualClass}
                data-value="Individual"
                aria-pressed={isIndividual}
                onclick={handleDonorType}
              >
                Individual
              </button>
              <button
                type="button"
                class={organizationClass}
                data-value="Organization"
                aria-pressed={isOrganization}
                onclick={handleDonorType}
              >
                Organization
              </button>
            </div>

            <template lwc:if={isIndividual}>
              <div class="row">
                <label class="field">
                  <span class="field-label">First name</span>
                  <input
                    class="input"
                    data-field="firstName"
                    value={firstName}
                    autocomplete="given-name"
                    maxlength="40"
                    oninput={handleInput}
                  />
                  <template lwc:if={firstNameError}
                    ><span class="field-error" role="alert"
                      >{firstNameError}</span
                    ></template
                  >
                </label>
                <label class="field">
                  <span class="field-label">Last name</span>
                  <input
                    class="input"
                    data-field="lastName"
                    value={lastName}
                    autocomplete="family-name"
                    maxlength="80"
                    oninput={handleInput}
                  />
                  <template lwc:if={lastNameError}
                    ><span class="field-error" role="alert"
                      >{lastNameError}</span
                    ></template
                  >
                </label>
              </div>
            </template>
            <template lwc:else>
              <label class="field">
                <span class="field-label">Organization name</span>
                <input
                  class="input"
                  data-field="organizationName"
                  value={organizationName}
                  autocomplete="organization"
                  maxlength="255"
                  oninput={handleInput}
                />
                <template lwc:if={organizationNameError}
                  ><span class="field-error" role="alert"
                    >{organizationNameError}</span
                  ></template
                >
              </label>
            </template>

            <label class="field">
              <span class="field-label">Email</span>
              <input
                class="input"
                type="email"
                data-field="email"
                value={email}
                autocomplete="email"
                maxlength="80"
                placeholder="you@example.com"
                oninput={handleInput}
              />
              <template lwc:if={emailError}
                ><span class="field-error" role="alert"
                  >{emailError}</span
                ></template
              >
            </label>
          </template>
        </template>

        <!-- Step 3: Review -->
        <template lwc:if={isReview}>
          <h2 class="title">Review your donation</h2>
          <p class="subtitle">Please check your details before submitting.</p>
          <div class="review">
            <div class="review-head">
              <img class="review-img" src={reviewImage} alt="" />
              <div>
                <p class="review-campaign">{campaignLabel}</p>
                <p class="review-label">Designation</p>
                <p class="review-value">{designationName}</p>
              </div>
            </div>
            <dl class="review-grid">
              <dt>Frequency</dt>
              <dd>
                {frequencyDisplay}
                <button
                  type="button"
                  class="link"
                  data-step="0"
                  onclick={handleEdit}
                >
                  Edit
                </button>
              </dd>
              <dt>Amount</dt>
              <dd class="strong">{amountDisplay}</dd>
              <dt>Donor</dt>
              <dd>
                <span class="strong">{donorDisplayName}</span>
                <template lwc:if={canEditDonor}>
                  <button
                    type="button"
                    class="link"
                    data-step="1"
                    onclick={handleEdit}
                  >
                    Edit
                  </button>
                </template>
                <span class="muted block">{donorDisplayEmail}</span>
              </dd>
            </dl>
          </div>
          <template lwc:if={submitError}>
            <p class="alert alert_error" role="alert">{submitError}</p>
          </template>
          <button
            type="button"
            class="btn btn_primary btn_block"
            data-id="submit"
            disabled={isSubmitting}
            onclick={handleSubmit}
          >
            {submitLabel}
          </button>
          <p class="notice notice_purple">
            <span class="notice-icon"
              ><c-abc-hope-icon
                name="info"
                size="14"
                stroke-width="2.6"
              ></c-abc-hope-icon></span
            >Payment simulation only
          </p>
        </template>

        <!-- Step 4: Thank you -->
        <template lwc:if={isThanks}>
          <div class="thanks">
            <span class="check"
              ><c-abc-hope-icon
                name="check"
                size="40"
                stroke-width="3"
              ></c-abc-hope-icon
            ></span>
            <span class="sparkle sparkle_a" aria-hidden="true">✦</span
            ><span class="sparkle sparkle_b" aria-hidden="true">✦</span
            ><span class="sparkle sparkle_c" aria-hidden="true">✦</span>
            <h2 class="title title_center">Your details have been received</h2>
            <p class="subtitle subtitle_center">
              Thank you for supporting {campaignLabel}!
            </p>
            <div class="thanks-card">
              <span class="thanks-icon"
                ><img class="thanks-img" src={reviewImage} alt=""
              /></span>
              <div>
                <p class="thanks-amount">
                  {resultAmountDisplay}
                  <span class="muted">{resultFrequencyNote}</span>
                </p>
                <p class="muted">{result.designationName}</p>
              </div>
            </div>
            <p class="ref">Reference: {result.reference}</p>
            <p class="notice notice_green">
              <span class="notice-icon notice-icon_green"
                ><c-abc-hope-icon
                  name="info"
                  size="14"
                  stroke-width="2.6"
                ></c-abc-hope-icon></span
              >No payment collected in this demo.
            </p>
            <template lwc:if={showRedirect}>
              <p class="redirect" data-id="redirect" aria-live="polite">
                {redirectNote}
                <a class="redirect-link" href={dashboardHref}>Go now</a>
              </p>
            </template>
            <button
              type="button"
              class="btn btn_secondary"
              onclick={handleRestart}
            >
              Make another donation
            </button>
          </div>
        </template>

        <template lwc:if={showNext}>
          <button
            type="button"
            class="btn btn_primary btn_block"
            data-id="next"
            onclick={handleNext}
          >
            Next
            <c-abc-hope-icon
              name="arrow"
              size="20"
              stroke-width="2.4"
            ></c-abc-hope-icon>
          </button>
        </template>
        <template lwc:if={showBack}>
          <button
            type="button"
            class="btn btn_link"
            data-id="back"
            onclick={handleBack}
          >
            <c-abc-hope-icon
              name="arrow-left"
              size="18"
              stroke-width="2.2"
            ></c-abc-hope-icon>
            Back
          </button>
        </template>
      </div>
    </template>
  </section>
</template>
