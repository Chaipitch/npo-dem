<template>
  <div class="shell">
    <aside class={sidebarClass}>
      <a class="brand" href={homeHref} aria-label="ABC Hope donor home">
        <svg class="logo" viewBox="0 0 48 40" aria-hidden="true">
          <path
            d="M17 36 4.5 23.5A8.6 8.6 0 0 1 17 11.6a8.6 8.6 0 0 1 12.5 11.9Z"
            fill="#7b5cf0"
          />
          <path
            d="M31 36 18.5 23.5A8.6 8.6 0 0 1 31 11.6a8.6 8.6 0 0 1 12.5 11.9Z"
            fill="#e5484d"
            opacity="0.92"
          />
          <path
            d="M24 32.5 18.6 27a4.4 4.4 0 0 1 5.4-6.6 4.4 4.4 0 0 1 5.4 6.6Z"
            fill="#fff"
            opacity="0.9"
          />
        </svg>
        <span class="brand-text"
          ><span class="brand-name">ABC Hope</span
          ><span class="brand-sub">Foundation</span></span
        >
      </a>
      <nav class="nav" aria-label="Donor portal">
        <template for:each={navItems} for:item="n">
          <template lwc:if={n.isAction}>
            <a key={n.key} class={n.className} href="#" onclick={handleAsk}>
              <c-abc-hope-icon name={n.icon} size="22"></c-abc-hope-icon
              ><span>{n.label}</span>
            </a>
          </template>
          <template lwc:else>
            <a
              key={n.key}
              class={n.className}
              href={n.href}
              aria-current={n.ariaCurrent}
              onclick={handleNav}
            >
              <c-abc-hope-icon name={n.icon} size="22"></c-abc-hope-icon
              ><span>{n.label}</span>
            </a>
          </template>
        </template>
      </nav>
      <div class="sidebar-art" aria-hidden="true">
        <template lwc:if={sidebarImageUrl}>
          <img class="sidebar-photo" src={sidebarImageUrl} alt="" />
        </template>
        <template lwc:else>
          <svg viewBox="0 0 260 300" preserveAspectRatio="xMidYMax slice">
            <circle cx="210" cy="120" r="46" fill="#fff4cf" opacity=".8" />
            <path
              d="M0 210c40-18 90-22 130-12s90 6 130-10v112H0Z"
              fill="#4a2c18"
            />
            <path
              d="M120 206c0-30 4-52 10-74"
              stroke="#4f9a3c"
              stroke-width="5"
              fill="none"
              stroke-linecap="round"
            />
            <path
              d="M128 150c-26-6-46 0-58 18 24 8 44 2 58-18Z"
              fill="#6cc04a"
            />
            <path
              d="M131 138c18-22 40-28 62-20-12 20-34 28-62 20Z"
              fill="#7ed05a"
            />
            <path
              d="M126 176c-20 2-34 12-40 28 20 0 34-10 40-28Z"
              fill="#5cae3e"
            />
            <path
              d="M133 168c16-10 34-10 48 0-14 12-32 12-48 0Z"
              fill="#6cc04a"
            />
            <ellipse
              cx="60"
              cy="240"
              rx="24"
              ry="5"
              fill="#000"
              opacity=".15"
            />
          </svg>
        </template>
        <p class="script">Stronger Communities.<br />Brighter Futures.</p>
      </div>
    </aside>
    <div class="scrim" onclick={closeDrawer} aria-hidden="true"></div>

    <div class="content">
      <header class="topbar">
        <button
          type="button"
          class="icon-btn menu-btn"
          aria-label="Open menu"
          onclick={toggleDrawer}
        >
          <c-abc-hope-icon name="menu" size="24"></c-abc-hope-icon>
        </button>
        <label class="search">
          <c-abc-hope-icon name="search" size="20"></c-abc-hope-icon>
          <input
            type="search"
            placeholder="Ask a question about your giving or our campaigns…"
            aria-label="Ask the ABC Hope assistant"
            onkeydown={handleSearchKey}
          />
        </label>
        <div class="user">
          <button
            type="button"
            class="user-btn"
            aria-haspopup="true"
            aria-expanded={userMenuOpen}
            onclick={toggleUserMenu}
          >
            <span class="avatar">{initial}</span>
            <span class="user-name">{firstName}</span>
            <c-abc-hope-icon name="chevron" size="18"></c-abc-hope-icon>
          </button>
          <template lwc:if={userMenuOpen}>
            <div class="user-menu" role="menu">
              <a role="menuitem" class="menu-item" href={profileHref}
                ><c-abc-hope-icon name="user" size="18"></c-abc-hope-icon>My
                Profile</a
              >
              <a role="menuitem" class="menu-item" href={publicHref}
                ><c-abc-hope-icon name="gift" size="18"></c-abc-hope-icon
                >Christmas Giving</a
              >
              <a role="menuitem" class="menu-item" href={logoutHref}
                ><c-abc-hope-icon name="logout" size="18"></c-abc-hope-icon>Log
                out</a
              >
            </div>
          </template>
        </div>
      </header>
      <slot name="header"></slot>
      <main class="main">
        <slot></slot>
      </main>
      <slot name="footer"></slot>
    </div>
  </div>
</template>
