<template>
  <div class="dash">
    <c-ts-abc-hope-dashboard-banner
      heading={title}
      subtitle={subtitle}
      image-url={bannerImageUrl}
      image-credit={bannerImageCredit}
    ></c-ts-abc-hope-dashboard-banner>

    <template lwc:if={isLoading}>
      <p class="muted pad" role="status">Loading your giving summary…</p>
    </template>
    <template lwc:elseif={error}>
      <p class="alert" role="alert">{error}</p>
    </template>
    <template lwc:else>
      <div class="layout">
        <div class="main">
          <c-ts-abc-hope-dashboard-kpis
            data={data}
            currency-label={currencyLabel}
            show-manage={isHome}
          ></c-ts-abc-hope-dashboard-kpis>

          <template lwc:if={isHome}>
            <template lwc:if={hasCampaigns}>
              <div class="section-head" data-section="campaigns">
                <h2 class="section-title">Campaigns You Can Support</h2>
              </div>
              <c-ts-abc-hope-dashboard-campaigns
                campaigns={campaigns}
                campaign-images={campaignImages}
                currency-label={currencyLabel}
              ></c-ts-abc-hope-dashboard-campaigns>
            </template>

            <div class="section-head">
              <h2 class="section-title">
                Our Shared Impact
                <span class="info"
                  ><c-ts-abc-hope-icon
                    name="info"
                    size="18"
                  ></c-ts-abc-hope-icon
                ></span>
              </h2>
            </div>
            <c-ts-abc-hope-dashboard-impact
              data={data}
              config={sharedImpact}
            ></c-ts-abc-hope-dashboard-impact>

            <div class="section-head" data-section="stories">
              <h2 class="section-title">
                Stories From the Programs You Support
              </h2>
            </div>
            <c-ts-abc-hope-dashboard-stories
              config={stories}
            ></c-ts-abc-hope-dashboard-stories>

            <div class="section-head" data-section="causes">
              <h2 class="section-title">Causes I Support</h2>
            </div>
            <c-ts-abc-hope-dashboard-causes
              items={causes}
            ></c-ts-abc-hope-dashboard-causes>

            <div class="section-head" data-section="journey">
              <h2 class="section-title">Your Impact Journey</h2>
            </div>
            <c-ts-abc-hope-dashboard-journey
              years={journeyYears}
              currency-label={currencyLabel}
            ></c-ts-abc-hope-dashboard-journey>
          </template>

          <template lwc:if={isGiving}>
            <div class="section-head" data-section="monthly">
              <h2 class="section-title">Recurring Gifts</h2>
            </div>
            <c-ts-abc-hope-donor-monthly-gifts
              currency-label={currencyLabel}
              donate-href={donateHref}
              ongiftschange={handleGiftsChange}
            ></c-ts-abc-hope-donor-monthly-gifts>

            <div class="section-head" data-section="history">
              <h2 class="section-title">Giving History</h2>
              <a class="give-again" href={donateHref}
                >Give again
                <c-ts-abc-hope-icon
                  name="arrow"
                  size="16"
                  stroke-width="2.4"
                ></c-ts-abc-hope-icon
              ></a>
            </div>
            <c-ts-abc-hope-dashboard-history
              currency-label={currencyLabel}
            ></c-ts-abc-hope-dashboard-history>
          </template>
        </div>

        <c-ts-abc-hope-dashboard-assistant
          class="agent-slot"
          data-section="agent"
          data={data}
          campaigns={campaigns}
          campaign-images={campaignImages}
          currency-label={currencyLabel}
          donate-path={donatePath}
          suggestions-config={agentSuggestions}
          accepts-questions={isHome}
        ></c-ts-abc-hope-dashboard-assistant>
      </div>
    </template>
  </div>
</template>
